<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Test – Leseapparat</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/belohnung.css">
  <!-- Nur für die Entwicklung: startet das Modul direkt (ohne Lader in app.js), Einstellungen aus der Adresse,
       z. B. test/leseapparat.html?b=9&h=bfk&t=80 (p=1: auch nicht dehnbare Laute) -->
</head>
<body>
  <main id="app">
    <!-- Kopfzeile wie in app.js: Zurück-Pfeil und Modulname -->
    <div class="kopf">
      <a class="knopf zurueck" aria-label="Zurück" href="../index.html"><svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 4 L7 12 L15 20"/></svg></a>
      <h1>Leseapparat</h1>
    </div>
    <div class="modul"></div>
  </main>
  <script type="module">
    import { leseEinstellungen, mitEinstellungen } from '../js/config.js';
    import { aktiviereSprechknoepfe } from '../js/audio.js';
    import { setzeSpielstand } from '../js/sterne.js';
    import { starte } from '../js/module/leseapparat.js';

    // Nicht dehnbare Laute zum Testen mit ?p=1, solange config.js das Feld noch nicht kennt
    const einstellungen = leseEinstellungen();
    if (!('plosive' in einstellungen)) einstellungen.plosive = new URLSearchParams(location.search).get('p') === '1';
    const zustand = {};
    setzeSpielstand(zustand);

    const app = document.getElementById('app');
    app.querySelector('.zurueck').href = mitEinstellungen('../index.html', einstellungen);
    aktiviereSprechknoepfe(app);
    const stopp = starte(app.querySelector('.modul'), { einstellungen, zustand, zurueck: () => history.back() });
    window.addEventListener('pagehide', () => stopp?.());
  </script>
</body>
</html>
